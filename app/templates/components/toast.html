<!-- Toast Container -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000; margin-top: 60px;">
    <div id="liveToast" class="toast glass-card border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header bg-transparent border-bottom border-secondary text-primary">
            <i id="toastIcon" class="bi me-2"></i>
            <strong class="me-auto" id="toastTitle">Notification</strong>
            <small class="text-muted" id="toastTime">Just now</small>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body text-primary" id="toastBody">
            Message goes here.
        </div>
    </div>
</div>
