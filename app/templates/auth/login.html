{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5" style="margin-top: -80px;">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card glass-card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-transparent border-0 text-center pt-5 pb-2">
                <div class="display-1 mb-3 text-primary">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h2 class="fw-bold">{{ _('Welcome Back') }}</h2>
                <p class="text-muted">{{ _('Login to manage your crypto portfolio') }}</p>
            </div>
            <div class="card-body px-5 pb-5 pt-3">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    {{ form.hidden_tag() if form else '' }}
                    
                    <div class="mb-4 form-floating">
                        <input type="text" class="form-control bg-secondary-custom border-secondary text-primary" id="username" name="username" placeholder="{{ _('Username') }}" required>
                        <label for="username" class="text-muted">{{ _('Username') }}</label>
                    </div>
                    
                    <div class="mb-4 form-floating">
                        <input type="password" class="form-control bg-secondary-custom border-secondary text-primary" id="password" name="password" placeholder="{{ _('Password') }}" required>
                        <label for="password" class="text-muted">{{ _('Password') }}</label>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">{{ _('Login') }}</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">{{ _('Don\'t have an account?') }}</span>
                    <a href="{{ url_for('auth.signup') }}" class="text-decoration-none fw-semibold ms-1">{{ _('Sign Up') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
