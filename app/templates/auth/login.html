{% extends "base.html" %}

{% block content %}
<style>
    /* Scoped exclusively to the login page */
    .login-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .login-container-grid {
        max-width: 1060px;
        width: 100%;
    }

    /* Left Side: Image & Branding (Floating without border outline) */
    .login-left-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }

    .branding-title {
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 0.25rem;
        transition: color 0.3s ease;
    }

    .branding-subtitle {
        font-size: 1.05rem;
        font-weight: 500;
        margin-bottom: 1.75rem;
        transition: color 0.3s ease;
    }

    .crypto-swap-img {
        max-width: 420px;
        width: 100%;
        height: auto;
        animation: floatAnimation 4s ease-in-out infinite;
        transition: filter 0.3s ease;
    }

    @keyframes floatAnimation {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
    }

    /* Right Side: Standalone Login Card */
    .login-form-card {
        border-radius: 1.25rem;
        padding: 3rem 2.5rem;
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .login-main-title {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 0.35rem;
        transition: color 0.3s ease;
    }

    .login-sub-text {
        font-size: 0.9rem;
        margin-bottom: 2rem;
        transition: color 0.3s ease;
    }

    .custom-input-group {
        position: relative;
        margin-bottom: 1.35rem;
    }

    .custom-input-group label {
        display: block;
        font-weight: 600;
        font-size: 0.875rem;
        margin-bottom: 0.45rem;
        transition: color 0.3s ease;
    }

    .custom-input-field {
        border-radius: 0.75rem !important;
        padding: 0.75rem 1rem !important;
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s ease-in-out;
    }

    .btn-login-action {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        color: #ffffff;
        font-weight: 700;
        padding: 0.85rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 1rem;
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        transition: all 0.2s ease;
        margin-top: 0.75rem;
    }

    .btn-login-action:hover {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        transform: translateY(-2px);
        color: #ffffff;
    }

    .signup-prompt {
        font-size: 0.9rem;
        margin-top: 1.5rem;
        transition: color 0.3s ease;
    }

    .signup-link {
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .signup-link:hover {
        text-decoration: underline !important;
    }

    /* ── Dark Mode Styles (Default) ── */
    :root, [data-bs-theme="dark"] {
        .branding-title { color: #ffffff !important; }
        .branding-subtitle { color: #94a3b8 !important; }
        .crypto-swap-img { filter: drop-shadow(0 15px 30px rgba(41, 121, 255, 0.25)); }
        
        .login-form-card {
            background: rgba(22, 27, 38, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(59, 130, 246, 0.35) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 25px rgba(41, 121, 255, 0.15);
        }

        .login-main-title { color: #ffffff !important; }
        .login-sub-text { color: #94a3b8 !important; }
        .custom-input-group label { color: #e2e8f0 !important; }

        .custom-input-field {
            background-color: rgba(15, 23, 42, 0.85) !important;
            border: 2px solid rgba(59, 130, 246, 0.4) !important;
            color: #ffffff !important;
        }

        .custom-input-field:focus {
            background-color: rgba(15, 23, 42, 1) !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.3) !important;
            color: #ffffff !important;
        }

        .signup-prompt { color: #94a3b8 !important; }
        .signup-link { color: #60a5fa !important; }
        .signup-link:hover { color: #93c5fd !important; }
    }

    /* ── Light Mode Styles ── */
    [data-bs-theme="light"] {
        .branding-title { color: #1e2022 !important; }
        .branding-subtitle { color: #6c757d !important; }
        .crypto-swap-img { filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1)); }

        .login-form-card {
            background: #ffffff !important;
            border: 1.5px solid #e2e8f0 !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
        }

        .login-main-title { color: #1e2022 !important; }
        .login-sub-text { color: #6c757d !important; }
        .custom-input-group label { color: #334155 !important; }

        .custom-input-field {
            background-color: #f8fafc !important;
            border: 2px solid #cbd5e1 !important;
            color: #1e2022 !important;
        }

        .custom-input-field:focus {
            background-color: #ffffff !important;
            border-color: #2563eb !important;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.2) !important;
            color: #1e2022 !important;
        }

        .signup-prompt { color: #64748b !important; }
        .signup-link { color: #2563eb !important; }
        .signup-link:hover { color: #1d4ed8 !important; }
    }

    @media (max-width: 767.98px) {
        .login-form-card {
            padding: 2.25rem 1.5rem;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-container-grid">
        <div class="row g-4 align-items-center">
            <!-- Left Side: Branding Text ABOVE Image (Floating without card outline) -->
            <div class="col-12 col-md-6 login-left-content text-center">
                <h3 class="branding-title mb-1">CryptoTracker</h3>
                <p class="branding-subtitle">{{ _('Smart Portfolio Management') }}</p>
                <img src="{{ url_for('static', filename='crypto_cartoon_swap.png') }}" alt="Cartoon Crypto Swap Illustration" class="crypto-swap-img">
            </div>

            <!-- Right Side: Standalone Login Card -->
            <div class="col-12 col-md-6">
                <div class="login-form-card">
                    <h2 class="login-main-title">{{ _('Login') }}</h2>
                    <p class="login-sub-text">{{ _('Login to manage your crypto portfolio') }}</p>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        {{ form.hidden_tag() if form else '' }}
                        
                        <div class="custom-input-group">
                            <label for="username">{{ _('Username') }}</label>
                            <input type="text" class="form-control custom-input-field" id="username" name="username" placeholder="{{ _('Username') }}" required>
                        </div>
                        
                        <div class="custom-input-group">
                            <label for="password">{{ _('Password') }}</label>
                            <input type="password" class="form-control custom-input-field" id="password" name="password" placeholder="{{ _('Password') }}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-login-action">{{ _('Login') }}</button>
                        </div>
                    </form>
                    
                    <div class="signup-prompt text-center text-md-start">
                        <span>{{ _('Don\'t have an account?') }}</span>
                        <a href="{{ url_for('auth.signup') }}" class="signup-link ms-1">{{ _('Sign Up') }}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
